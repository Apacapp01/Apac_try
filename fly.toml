app = "your-app-name"

[build]
  [build.args]
    PYTHON_VERSION = "3.10"

[env]
  PORT = "8000"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[vm]
  memory = "1024"
  cpu_kind = "shared"
  cpus = 1
